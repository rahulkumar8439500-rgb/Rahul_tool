    function copyToClipboard(text) {
        return new Promise((resolve, reject) => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(resolve).catch(reject);
            } else {
                try {
                    const temp = document.createElement('textarea');
                    temp.value = text;
                    temp.style.position = 'fixed';
                    temp.style.opacity = '0';
                    document.body.appendChild(temp);
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                    resolve();
                } catch (err) { reject(err); }
            }
        });
    }

    function attachRippleEffect() {
        document.querySelectorAll('.btn, .menu-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.classList.add('ripple');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
                playSound('click');
                if (settings.haptic && navigator.vibrate) navigator.vibrate(10);
            });
        });
    }

    function loginWithReferral() {
        let code = (document.getElementById('referralCode')?.value || '').trim().toUpperCase();
        const username = (document.getElementById('refUsername')?.value || '').trim();
        const password = (document.getElementById('refPassword')?.value || '').trim();

        if (!code) return showToast('Referral Code daalein!', true);
        if (!username || username.length < 3) return showToast('Username kam se kam 3 characters!', true);
        if (!password || password.length < 3) return showToast('Password kam se kam 3 characters!', true);

        const ref = referrals.find(r => r.code.toUpperCase() === code);
        if (!ref) {
            console.log('Available referrals:', referrals.map(r => r.code));
            return showToast('Invalid Referral Code!', true);
        }
        if (ref.used) return showToast('Yeh Referral Code already use ho chuka hai!', true);
        if (users.find(u => u.username.toLowerCase() === username.toLowerCase())) return showToast('Username already exists!', true);

        const expiry = new Date();
        expiry.setDate(expiry.getDate() + (ref.days || 30));

        const newUser = {
            id: Date.now(), username, password, referralCode: code, days: ref.days, amount: ref.amount,
            role: ref.role || 'user', status: 'active', expiry: expiry.toISOString().split('T')[0],
            createdAt: new Date().toLocaleString(), referralUsed: true,
            balance: ref.amount || 0
        };
        users.push(newUser);
        saveUsers();
        ref.used = true; ref.usedBy = username; ref.usedAt = new Date().toLocaleString();
        saveReferrals();

        currentUser = newUser; currentRole = newUser.role;
        localStorage.setItem('rahulCurrentUser', JSON.stringify(currentUser));
        localStorage.setItem('rahulRole', currentRole);

        addLog('REFERRAL_LOGIN', `${username} logged in with referral ${code} as ${newUser.role} (Balance: ₹${newUser.balance})`);
        showToast(`Welcome! ${ref.days} days + ₹${ref.amount} balance mil gaya.`);
        playSound('success');

        renderMainApp();
        updateUserDisplay(); generatePanels(); showPage('dashboard');
    }

    async function sendOwnerOtp() {

        const email = (emailInput.value || '').trim().toLowerCase();

        // ✅ Check if email matches ANY of the owner emails

            return showToast('Yeh Gmail Owner ki nahi hai!', true);
        }

            showToast('Demo OTP screen par dikhaya gaya!');

    }

    function moveOtp(current, index) {
        current.value = current.value.replace(/[^0-9]/g, '');
        if (current.value.length === 1) {
            const next = current.nextElementSibling;
            if (next && next.tagName === 'INPUT') next.focus();
        }
    }

    function otpKeydown(event, index) {
        if (event.key === 'Backspace' && !event.target.value) {
            const prev = event.target.previousElementSibling;
            if (prev && prev.tagName === 'INPUT') prev.focus();
        }
    }

    function verifyOwnerOtp() {
        const inputs = document.querySelectorAll('.otp-inputs input');
        if (!inputs || inputs.length === 0) return showToast('OTP inputs not found!', true);
        
        let otp = '';
        inputs.forEach(input => otp += (input.value || '').trim());
        
        if (otp.length !== 6) return showToast('6-digit OTP daalein!', true);
        if (Date.now() > ownerOtpExpiry) return showToast('OTP expire ho gaya! Dobara bhejein.', true);
        if (otp !== ownerOtp) return showToast('Galat OTP! Dobara try karein.', true);

        currentRole = 'owner';
        currentUser = { username: 'Owner', role: 'owner', balance: Infinity, email: lastOwnerEmail };
        localStorage.setItem('rahulRole', currentRole);
        localStorage.setItem('rahulCurrentUser', JSON.stringify(currentUser));
        
        if (!ownerCredentials) {
            const newUsername = prompt('Owner Username set karein (future logins ke liye):');
            if (newUsername && newUsername.trim()) {

                if (newPassword && newPassword.trim()) {

                    localStorage.setItem('rahulOwnerCreds', JSON.stringify(ownerCredentials));
                    showToast('Owner credentials saved!');

        showToast(`Owner Login Successful! (${lastOwnerEmail})`);
        playSound('success');
        
        renderMainApp();
        updateUserDisplay(); generatePanels(); showPage('dashboard');
        addLog('OWNER_LOGIN', `Owner logged in: ${lastOwnerEmail}`);
    }

    function playSound(type) {
        if (!settings.sound && !settings.soundOnActions) return;
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine'; oscillator.frequency.value = type === 'click' ? 800 : (type === 'success' ? 1200 : 400);
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.1);
        } catch(e) {}
    }

    function generatePanels() {
        const panels = getPanelsForRole();
        const sidebar = document.getElementById('sidebarMenu');
        const container = document.getElementById('contentContainer');
        if (!sidebar || !container) return;
        sidebar.innerHTML = ''; container.innerHTML = '';
        panels.forEach(panel => {
            const li = document.createElement('li');
            li.setAttribute('onclick', `showPage('${panel.id}')`);
            li.innerHTML = `${panel.icon} ${panel.title}`;
            li.id = `menu-${panel.id}`;
            sidebar.appendChild(li);

            const div = document.createElement('div');
            div.id = panel.id; div.className = 'main-content';
            div.innerHTML = panel.content;
            container.appendChild(div);
        });
        const logoutLi = document.createElement('li');
        logoutLi.setAttribute('onclick', 'logout()');
        logoutLi.style.color = 'var(--danger)';
        logoutLi.style.marginTop = '18px';

    function showPage(pageId) {
        document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.sidebar ul li').forEach(el => el.classList.remove('active'));
        const page = document.getElementById(pageId);
        if(page) page.classList.add('active');
        const menu = document.getElementById(`menu-${pageId}`);
        if(menu) menu.classList.add('active');
        const panels = getPanelsForRole();
        const panel = panels.find(p => p.id === pageId);
        if(panel) safeSetText('pageTitle', panel.title);
        if (window.innerWidth < 768) toggleSidebar();
        if(pageId === 'dashboard') { renderDashboardStats(); renderChart(); }
        if(pageId === 'keysList') { renderKeysList(); }
        if(pageId === 'logs') { renderLogs(); }
        if(pageId === 'usersManage') { renderUserManageList(); }
        if(pageId === 'referralManager') { renderReferralList(); }
        if(pageId === 'deviceManage') { renderDeviceManage(); }
        if(pageId === 'keyLinkGenerator') { renderLinkGenerator(); }
        if(pageId === 'settings') { loadSettingsUI(); }
    }

    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (sidebar) sidebar.classList.toggle('open');

    }

    function generateLink() {
        const sel = document.getElementById('linkKeySelect');
        if (!sel) return showToast('Key selector not found', true);
        const keyStr = sel.value;
        if (!keyStr) return showToast('Pehle key select karein!', true);
        const key = keys.find(k => k.key === keyStr);
        if (!key) return showToast('Key not found!', true);
        
        const baseUrl = window.location.origin + window.location.pathname;
        const unlockLink = `${baseUrl}?key=${encodeURIComponent(key.key)}`;
        key.unlockLink = unlockLink;
        saveKeys();
        
        const res = document.getElementById('linkResultContainer');
        if (res) {
            res.innerHTML = `
                <div class="link-box">${unlockLink}</div>
                <button class="btn" onclick="copyLink('${unlockLink}')">📋 COPY LINK</button>
                <button class="btn btn-secondary" style="margin-top: 8px;" onclick="testLink('${unlockLink}')">🔍 TEST LINK</button>
            `;
        }
        renderAllLinks();
        showToast('Link Generated!');
        addLog('GENERATE_LINK', key.key);
    }

    // =====================================================================
    // --- 13. LICENSE KEY MANAGEMENT ---
    // =====================================================================
    function createKey() {
        const game = document.getElementById('keyGame').value;
        const planId = document.getElementById('keyPlan').value;
        const plan = licensePlans.find(p => p.id === planId);
        const maxDevices = parseInt(document.getElementById('keyMaxDevices').value) || 1;
        const bulkCount = parseInt(document.getElementById('keyBulkCount').value) || 1;
        let customKey = document.getElementById('newKeyInput').value.trim();

        const totalCost = plan.price * bulkCount;

        if (!hasEnoughBalance(totalCost)) {
            return showToast(`❌ Insufficient Balance! Aapke paas ₹${getMyBalance()} hai, lekin ₹${totalCost} chahiye.`, true);
        }

        if (!deductBalance(totalCost)) {
            return showToast('❌ Balance deduct fail!', true);
        }

        let createdKeys = [];
        for (let i = 0; i < bulkCount; i++) {
            const keyStr = (bulkCount === 1 && customKey) ? customKey : generateRandomKey();
            const expiry = new Date();
            if (plan.days >= 1) expiry.setDate(expiry.getDate() + plan.days);
            else expiry.setHours(expiry.getHours() + plan.days * 24);

            const newKey = {
                id: Date.now() + i, key: keyStr, game, plan: plan.label, price: plan.price,
                status: 'active', expiry: expiry.toISOString().split('T')[0],
                devices: [], maxDevices, uses: 0, createdAt: new Date().toLocaleString(), unlockLink: '',
                createdBy: currentUser ? currentUser.username : 'owner'
            };
            keys.push(newKey);
            createdKeys.push(newKey);
        }
        saveKeys(); 
        addLog('CREATE_LICENSE', `${bulkCount} ${game} keys (${plan.label}) - ₹${totalCost} deducted`);
        showToast(`${bulkCount} Keys Created! ₹${totalCost} deducted.`);
        document.getElementById('newKeyInput').value = '';
        
        const resultDiv = document.getElementById('createdKeyResult');
        if (resultDiv) {
            resultDiv.innerHTML = createdKeys.map(k => `
                <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--glass-border);">
                    <div style="color: var(--primary-color); font-weight: 700; font-size: 12px;">${k.key}</div>
                    <div style="font-size: 10px; color: var(--text-muted); margin: 3px 0;">${k.game} | ${k.plan} | Expiry: ${k.expiry}</div>
                    <div style="display: flex; gap: 6px; margin-top: 6px;">
                        <button class="btn btn-copy" style="padding: 6px 10px; font-size: 10px; flex: 1;" onclick="copyKeyOnly('${k.key}')">📋 COPY KEY</button>
                        <button class="btn btn-copy" style="padding: 6px 10px; font-size: 10px; flex: 1;" onclick="copyFullLicense('${k.key}')">📄 FULL LICENSE</button>
                    </div>
                </div>
            `).join('');
        }
        
        renderDashboardStats(); renderKeysList();
        updateUserDisplay();
        if (document.getElementById('createKeyBalance')) {
            document.getElementById('createKeyBalance').innerText = currentRole === 'owner' ? '∞' : `₹${getMyBalance()}`;
        }
    }

    function bulkGenerate() {
        const game = document.getElementById('bulkGame').value;
        const planId = document.getElementById('bulkPlan').value;
        const plan = licensePlans.find(p => p.id === planId);
        const count = parseInt(document.getElementById('bulkCount').value) || 10;
        const maxDevices = parseInt(document.getElementById('bulkMaxDevices').value) || 1;
        if (count > 500) return showToast('Max 500 keys', true);

        const totalCost = plan.price * count;
        if (currentRole !== 'owner') {
            if (!hasEnoughBalance(totalCost)) {
                return showToast(`❌ Insufficient Balance! ₹${totalCost} chahiye.`, true);
            }
            if (!deductBalance(totalCost)) return showToast('❌ Balance deduct fail!', true);
        }

        for (let i = 0; i < count; i++) {
            const expiry = new Date();
            if (plan.days >= 1) expiry.setDate(expiry.getDate() + plan.days);
            else expiry.setHours(expiry.getHours() + plan.days * 24);
            keys.push({
                id: Date.now() + i, key: generateRandomKey(), game, plan: plan.label, price: plan.price,
                status: 'active', expiry: expiry.toISOString().split('T')[0], devices: [], maxDevices, uses: 0, createdAt: new Date().toLocaleString(), unlockLink: '',
                createdBy: currentUser ? currentUser.username : 'owner'
            });
        }
        saveKeys(); 
        addLog('BULK_LICENSE', `${count} ${game} keys - ₹${totalCost}`);
        showToast(`${count} Keys Generated! ${currentRole !== 'owner' ? '₹' + totalCost + ' deducted.' : ''}`);
        renderDashboardStats(); renderKeysList(); updateUserDisplay();
    }

    let selectedKeys = new Set();
    function renderKeysList(filterText = '') {
        const c = document.getElementById('keysListContainer'); if (!c) return;
        let filtered = keys.filter(k => k.key.toLowerCase().includes(filterText.toLowerCase()));
        c.innerHTML = filtered.length === 0 ? '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:11px;">🔑 No keys found</div>' : '';
        filtered.forEach(k => {
            const div = document.createElement('div'); 
            div.className = 'key-item';
            div.innerHTML = `
                <div style="flex:2; min-width: 0;">
                    <div style="color:var(--primary-color); font-weight:700; font-size:10px; word-break: break-all;">${k.key}</div>
                    <div style="font-size:9px; color:var(--text-muted);">${k.game} | ${k.plan} | ${k.expiry}</div>
                </div>
                <div style="flex:1; text-align:center;">
                    <span class="key-status ${k.status==='active'?'active':'expired'}">${k.status}</span>
                </div>
                <div style="flex:1; text-align:right; font-size:9px;">
                    ${(k.devices||[]).length}/${k.maxDevices}<br>₹${k.price}
                </div>
                <button class="copy-btn-sm" onclick="copyKeyOnly('${k.key}')" title="Copy Key">📋</button>
                <button class="copy-btn-sm" onclick="copyFullLicense('${k.key}')" title="Copy Full License">📄</button>
                <div style="margin-left: 4px;">
                    <input type="checkbox" onchange="toggleKeySelect('${k.key}')" ${selectedKeys.has(k.key)?'checked':''}>
                </div>
            `;
            c.appendChild(div);
        });
    }
    function searchKeys(v) { renderKeysList(v); }
    function toggleKeySelect(k) { selectedKeys.has(k) ? selectedKeys.delete(k) : selectedKeys.add(k); }
    function selectAllKeys() { keys.forEach(k => selectedKeys.add(k.key)); renderKeysList(); }
    function deleteSelectedKeys() { if(selectedKeys.size===0) return showToast('No keys selected',true); if(confirm(`Delete ${selectedKeys.size} keys?`)){ keys=keys.filter(k=>!selectedKeys.has(k.key)); selectedKeys.clear(); saveKeys(); renderKeysList(); renderDashboardStats(); showToast('Deleted!'); } }
    function updateKey() { const k=document.getElementById('updateKey').value.trim(); const s=document.getElementById('updateStatus').value; const md=parseInt(document.getElementById('updateMaxDevices').value); const i=keys.findIndex(x=>x.key===k); if(i===-1) return showToast('Key not found',true); if(s) keys[i].status=s; if(md) keys[i].maxDevices=md; saveKeys(); renderKeysList(); renderDashboardStats(); showToast('Updated!'); }
    function extendKey() { const k=document.getElementById('updateKey').value.trim(); const d=parseInt(document.getElementById('extendDays').value); if(!d) return showToast('Enter days',true); const i=keys.findIndex(x=>x.key===k); if(i===-1) return showToast('Key not found',true); const nd=new Date(keys[i].expiry); nd.setDate(nd.getDate()+d); keys[i].expiry=nd.toISOString().split('T')[0]; keys[i].status='active'; saveKeys(); renderKeysList(); renderDashboardStats(); showToast('Extended!'); }
    function resetDevices() { const k=document.getElementById('updateKey').value.trim(); const i=keys.findIndex(x=>x.key===k); if(i===-1) return showToast('Key not found',true); keys[i].devices=[]; saveKeys(); renderKeysList(); showToast('Devices Reset!'); }
    function deleteKeyPermanent() { const k=document.getElementById('deleteKeyInput').value.trim(); if(!k) return showToast('Enter key',true); if(confirm('Delete?')){ keys=keys.filter(x=>x.key!==k); saveKeys(); renderKeysList(); renderDashboardStats(); showToast('Deleted!'); } }
    function kickDevice() { const k=document.getElementById('kickKey').value; const d=document.getElementById('kickDeviceId').value; if(!k||!d) return showToast('Enter Key & Device',true); const i=keys.findIndex(x=>x.key===k); if(i===-1) return showToast('Key not found',true); keys[i].devices = (keys[i].devices||[]).filter(dev => dev !== d); saveKeys(); addLog('KICK', `${d} from ${k}`); showToast('Device Kicked!'); }

    // =====================================================================
    // --- 14. DEVICE MANAGER ---
    // =====================================================================
    function addDeviceToKey() {
        const keyStr = document.getElementById('dmKey').value.trim();
        const deviceId = document.getElementById('dmDeviceId').value.trim();
        if (!keyStr || !deviceId) return showToast('Enter Key & Device ID', true);
        const idx = keys.findIndex(k => k.key === keyStr);
        if (idx === -1) return showToast('Key not found', true);
        if (!keys[idx].devices) keys[idx].devices = [];
        if (keys[idx].devices.includes(deviceId)) return showToast('Device already added', true);
        if (keys[idx].devices.length >= keys[idx].maxDevices) return showToast(`Max ${keys[idx].maxDevices} devices allowed`, true);
        keys[idx].devices.push(deviceId);
        keys[idx].uses = keys[idx].devices.length;
        saveKeys(); renderDeviceManage(); renderKeysList();
        addLog('ADD_DEVICE', `${deviceId} to ${keyStr}`);
        showToast('Device Added!');
    }

    function renderDeviceManage() {
        const c = document.getElementById('deviceListContainer');
        if (!c) return;
        let html = '';
        keys.forEach(k => {
            if (k.devices && k.devices.length > 0) {
                html += `<div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--glass-border);">
                    <div style="color: var(--primary-color); font-weight: 700; font-size: 11px;">${k.key}</div>
                    <div style="font-size: 9px; color: var(--text-muted); margin: 3px 0;">${k.game} | ${k.plan} | Max: ${k.maxDevices}</div>
                    <div style="margin-top: 5px;">${k.devices.map(d => `<span class="device-badge">${d}</span>`).join('')}</div>
                </div>`;
            }
        });
        c.innerHTML = html || 'No devices registered';
    }

    // =====================================================================
    // --- 15. DASHBOARD & LOGS ---
    // =====================================================================
    function renderDashboardStats() {
        const el = (id) => document.getElementById(id);
        if(el('statTotal')) el('statTotal').innerText = keys.length;
        if(el('statActive')) el('statActive').innerText = keys.filter(k => k.status === 'active').length;
        if(el('statExpired')) el('statExpired').innerText = keys.filter(k => k.status === 'expired').length;
        if(el('statDevices')) el('statDevices').innerText = keys.reduce((a, k) => a + (k.devices || []).length, 0);
        if(el('statUses')) el('statUses').innerText = keys.reduce((a, k) => a + (k.uses || 0), 0);
        if(el('statReferrals')) el('statReferrals').innerText = referrals.length;
        if(el('dashBalance')) el('dashBalance').innerText = currentRole === 'owner' ? '∞' : `₹${getMyBalance()}`;
        if(el('createKeyBalance')) el('createKeyBalance').innerText = currentRole === 'owner' ? '∞' : `₹${getMyBalance()}`;
    }
    function renderChart() { 
        const c=document.getElementById('chartContainer'); if(!c) return; c.innerHTML=''; 
        const d=[0,0,0,0,0,1,2]; const m=Math.max(...d,1); 
        d.forEach(v=>{ const b=document.createElement('div');b.className='bar';b.style.height=`${(v/m)*100}%`;b.innerHTML=`<span class="bar-value">${v}</span>`;c.appendChild(b); }); 
    }
    function renderLogs() { 
        const c=document.getElementById('logsContainer'); if(!c) return; 
        c.innerHTML=logs.length===0?'No logs yet':logs.slice(0,15).map(l=>`<div style="border-bottom:1px solid rgba(255,255,255,0.05); padding:6px 0; font-size: 10px;"><span style="color:var(--primary-color); font-weight: 600;">[${l.time}]</span> <b>${l.action}</b>: ${l.details}</div>`).join(''); 
    }
    function refreshLogs() { renderLogs(); showToast('Logs Refreshed'); }

    // =====================================================================
    // --- 16. BACKUP ---
    // =====================================================================
    function downloadBackup(type) {
        let content='', filename='', mime='';
        if(type==='json'){ content=JSON.stringify({keys,users,referrals,logs,telegramUsername},null,2); filename=`rahul_backup_${Date.now()}.json`; mime='application/json'; }
        else if(type==='csv'){ let r=['Key,Game,Plan,Status,Expiry,Devices,Uses,UnlockLink']; keys.forEach(k=>r.push(`${k.key},${k.game},${k.plan},${k.status},${k.expiry},${(k.devices||[]).length},${k.uses},${k.unlockLink||''}`)); content=r.join('\n'); filename=`rahul_keys_${Date.now()}.csv`; mime='text/csv'; }
        else { let r=['RAHUL TOOL LICENSE KEYS','']; keys.forEach(k=>r.push(`${k.key} | ${k.game} | ${k.plan} | ${k.status} | ${k.expiry}`)); content=r.join('\n'); filename=`rahul_keys_${Date.now()}.txt`; mime='text/plain'; }
        try { 
            const uri=`data:${mime},${encodeURIComponent(content)}`; 
            const a=document.createElement('a'); a.href=uri; a.download=filename; a.style.display='none'; 
            document.body.appendChild(a); a.click(); 
            setTimeout(()=>document.body.removeChild(a),100); 
            showToast(`${type.toUpperCase()} Downloaded!`); 
            addLog('BACKUP',type); 
        } catch(e) { showToast('Download fail!',true); }
    }

    // =====================================================================
    // --- 17. TRIAL, USERS, SETTINGS ---
    // =====================================================================
    function refreshTrials() { showToast('Refreshed'); }
    function deleteAllTrials() { if(confirm('Delete all trials?')){ trials=[]; saveTrials(); showToast('Deleted!'); } }
    
    function renderUserManageList() { 
        const c=document.getElementById('userManageContainer'); if(!c) return; 
        c.innerHTML=users.length===0?'No users yet':users.map(u=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size: 11px;">
                <div>
                    <div><b>ID: ${u.id}</b> - ${u.username} <span class="role-badge" style="font-size: 7px; padding: 2px 5px;">${u.role}</span></div>
                    <div style="color: var(--success); font-size: 10px;">Balance: ₹${u.balance || 0}</div>

            </div>
        `).join(''); 
    }
    
    function deleteUser(id) { users=users.filter(u=>u.id!==id); saveUsers(); renderUserManageList(); showToast('User Deleted'); }
    
    function addBalanceFromPanel() {
        const userId = parseInt(document.getElementById('addBalanceUserId').value);
        const amount = parseInt(document.getElementById('addBalanceAmount').value);
        if (!userId || !amount) return showToast('User ID aur Amount daalein!', true);

            showToast(`₹${amount} added to user ID ${userId}`);
            renderUserManageList();
            document.getElementById('addBalanceUserId').value = '';
            document.getElementById('addBalanceAmount').value = '';

            showToast('User not found!', true);
        }

    function updateSetting(k,v) { settings[k]=v; saveSettings(); showToast(`${k} ${v?'ON':'OFF'}`); }
    function clearAllData() { if(confirm('Clear all data?')){ localStorage.clear(); location.reload(); } }
    function pushVersion() { showToast('Version Pushed!'); addLog('VERSION', document.getElementById('versionInput').value); }
    function pushNotice() { showToast('Notice Pushed!'); addLog('NOTICE', document.getElementById('noticeText').value); }

    // =====================================================================
    // --- 18. REFERRAL MANAGEMENT ---
    // =====================================================================
    function createReferral() {
        let code = document.getElementById('newRefCode').value.trim().toUpperCase();
        if (!code) code = 'RAHUL-' + Math.random().toString(36).substring(2, 8).toUpperCase();
        const days = parseInt(document.getElementById('newRefDays').value) || 30;
        const amount = parseInt(document.getElementById('newRefAmount').value) || 0;
        const role = document.getElementById('newRefRole').value;
        if (referrals.find(r => r.code.toUpperCase() === code)) return showToast('Yeh code already exists!', true);
        referrals.push({ code, days, amount, role, createdBy: currentRole, used: false, createdAt: new Date().toLocaleString() });
        saveReferrals(); renderReferralList();
        addLog('CREATE_REFERRAL', `Code: ${code}, Balance: ₹${amount}`);
        showToast(`Referral ${code} created! ₹${amount} balance.`);
        document.getElementById('newRefCode').value = '';
    }

    function renderReferralList() {
        const c = document.getElementById('referralListContainer');
        if (!c) return;
        if (referrals.length === 0) { c.innerHTML = 'No referrals'; return; }
        c.innerHTML = referrals.map(r => `
            <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--glass-border);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div style="color: var(--primary-color); font-weight: 700; font-size: 11px;">${r.code}</div>
                        <div style="font-size: 10px; color: var(--text-muted); margin: 3px 0;">${r.days} days • ₹${r.amount} balance • ${r.role}</div>
                        <div style="font-size: 9px; color: ${r.used ? '#10b981' : '#ffd700'}; font-weight: 600;">${r.used ? '✅ Used by ' + (r.usedBy || 'someone') : '⏳ Available'}</div>
                    </div>
                    <button class="btn btn-danger" style="width: auto; padding: 5px 12px; font-size: 9px;" onclick="deleteReferral('${r.code}')">Del</button>
                </div>
            </div>
        `).join('');
    }

    function deleteReferral(code) {
        if (confirm('Delete referral ' + code + '?')) {
            referrals = referrals.filter(r => r.code.toUpperCase() !== code.toUpperCase());
            saveReferrals(); renderReferralList();
            showToast('Referral deleted');
        }
    }
